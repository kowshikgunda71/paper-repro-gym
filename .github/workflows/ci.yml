name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install: the core has no dependencies, but this puts `gym`
      # on PATH and checks that the packaging metadata is valid on every push.
      - name: Install (editable, no dependencies)
        run: pip install -e .


      - name: Pre-pull the example image
        # So the live containment canary in the test suite actually runs
        # (it refuses to pull on its own). This exercises the real container
        # path — network isolation, resource caps, the A1 gate — on every push.
        run: docker pull python:3.12-alpine

      - name: Report the container boundary
        run: gym preflight || true

      - name: Run tests (offline + live containment canary)
        run: python3 tests/test_gym.py
